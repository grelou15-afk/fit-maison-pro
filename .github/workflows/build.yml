name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Appliquer la spec
        run: |
          if [ -f apply_spec.py ]; then python apply_spec.py; fi
      - name: Créer le projet Android
        run: |
          mkdir -p www
          HTML=$(find . -maxdepth 2 -name "*.html" -not -path "./node_modules/*" -not -path "./www/*" | head -n 1)
          echo "Fichier utilisé : $HTML"
          cp "$HTML" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Fit Maison Pro" com.fitmaison.pro --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Fabriquer l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
