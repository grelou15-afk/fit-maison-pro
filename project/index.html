body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:150px}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:17px;margin:0}
header .x{white-space:nowrap}
.cash{background:rgba(255,255,255,.12);border-radius:20px;padding:6px 12px;font-size:13px}
.cash b{color:var(--pen);font-size:15px}
main{padding:12px;max-width:640px;margin:auto}
h3{margin:18px 0 8px;font-size:16px}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.btn{display:block;text-align:center;cursor:pointer;background:var(--pr);color:var(--pt);border:1px solid var(--pr);border-radius:10px;padding:12px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--pr);border-color:var(--bd)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.4}
.wide{width:100%;margin-top:10px}
.srch{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font-size:16px;margin-bottom:10px}
.card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.th{cursor:zoom-in;width:64px;height:64px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:26px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:contain;background:#fff}
.q{min-width:44px;height:44px;padding:0 8px;border-radius:22px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:18px}
.q.low{background:var(--bad);color:#fff}
small,.mu{color:var(--mu)}
small{display:block}
.act{display:flex;gap:8px;margin-top:8px}
.r2{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.r2>div{flex:1;min-width:0}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:6px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.t{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
.t b{display:block;font-size:18px;margin-top:2px}
.t.big b{font-size:28px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--mu);font-size:12px}
nav button.on{color:var(--pr);font-weight:700}
nav i{display:block;font-style:normal;font-size:20px}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--pen);color:#1a1a1a;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px}
.sheet h3{margin-top:0}
form label{display:block;flex:1;font-size:13px;color:var(--mu);margin-top:10px}
form input,form select{width:100%;margin-top:4px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
form .row{margin-top:14px}
.chk{display:flex!important;gap:8px;align-items:center;color:var(--tx)!important}
.chk input{width:auto;margin:0}
.ph{display:grid!important;place-items:center;min-height:100px;border:2px dashed var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;text-align:center}
.ph img{width:100%;max-height:300px;object-fit:contain;background:#fff}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
button.t{text-align:start;font:inherit;color:inherit;cursor:pointer}.t.sel{border:2px solid var(--pen)}
body.staff .adm{display:none!important}summary{cursor:pointer}
header h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lgin{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
body.locked #lgin{display:flex}
body.locked>header,body.locked>main,body.locked>nav,body.locked>.fab{display:none!important}
.lgc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px 20px 22px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.lgc h1{font-size:20px;margin:4px 0;text-align:center}
.lgc .ic{font-size:44px;text-align:center;line-height:1.1}
.lgc p{text-align:center;margin:6px 0 10px}
#lgE{min-height:1.5em;margin:8px 0 0;font-weight:600}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}

.posw{display:grid;grid-template-columns:1fr 124px;gap:8px;align-items:start}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:6px;text-align:center;color:var(--tx);cursor:pointer;display:block;font:inherit}
.tile:disabled{opacity:.35}.tile:active{border-color:var(--pen)}
.tile .pi{height:96px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:28px;overflow:hidden}
.tile .pi img{width:100%;height:100%;object-fit:contain;background:#fff}
.tile b{display:block;font-size:13px;margin-top:4px;line-height:1.2}.tile span{color:var(--ok);font-weight:700;font-size:13px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.kp .kd{grid-column:1/4;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.kp .kd b{font-size:22px}
.kp button{height:46px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font-size:20px;font-weight:700}

<script>
const $=s=>document.querySelector(s),K='armoire_v1';
let sT,lastCat='',busy=0;
let db={items:[],sales:[],cash:[]},tab='stock',q='',tmp='',cb='day',per='mois',RT='',role='admin',who='Admin',stream=null;
try{db=JSON.parse(localStorage.getItem(K))||db}catch(e){}
db.fond??=0;db.closes??=[];db.invs??=[];db.log??=[];db.goal??=0;db.pend??=[];db.bons??=[];db.kits??=[];db.debts??=[];db.phones??={};db.perms??={};db.holds??=[];db.moves??=[];db.shifts??=[];if(db.pin2&&!db.sellers)db.sellers=[{id:'v1',name:'Vendeur',pin:db.pin2}];db.sellers??=[];db.cash.forEach(c=>{if(!c.box)c.box=c.type==='in'?'day':'main'});
function save(x){trackMoves();let ok=1;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){ok=0;toast('Mémoire pleine : exportez une sauvegarde et supprimez des photos')}if(!x&&db.sync&&db.sync.url){clearTimeout(sT);sT=setTimeout(syncTick,1500)}return ok}
const nd=s=>String(s??'').trim().replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632).replace(/[\u06f0-\u06f9]/g,c=>c.charCodeAt(0)-1776);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fm=n=>(Math.round(n*100)/100).toLocaleString('fr-FR')+' DA';
const dt=d=>d?d.split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const tot=s=>s.qty*s.price-(s.disc||0),paid=s=>s.paid??tot(s),due=s=>tot(s)-paid(s);
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const bal=b=>sum(db.cash.filter(c=>c.box===b),c=>c.type==='in'?c.amount:-c.amount);
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}
function closeM(){$('#m').classList.remove('on');$('#m').style.background='';$('#m').style.alignItems=''}
function modal(h,body,ok,lbl='Enregistrer',extra=''){
 $('#m').innerHTML=`<div class="sheet"><h3>${h}</h3><form id="f">${body}<div class="row"><button type="button" class="btn ghost" onclick="closeM()">Annuler</button><button class="btn">${lbl}</button></div>${extra}</form></div>`;
 $('#m').classList.add('on');
 $('#f').onsubmit=e=>{e.preventDefault();ok(new FormData(e.target))};
}
function ask(msg,fn){modal('Confirmer','<p>'+msg+'</p>',()=>{closeM();fn()},'Oui, confirmer')}
function go(t){const N={stock:'stk',sales:'hist',cash:'cash',clients:'clients',stats:'-'};if(role==='staff'&&N[t]&&!can(N[t]))return;tab=t;q='';render()}

/* Photo : réduite avant stockage pour économiser la mémoire */
function zoomPh(id){const i=db.items.find(x=>x.id===id);if(!i||!i.photo)return;$('#m').innerHTML=`<div class="sheet" style="text-align:center"><h3>${esc(i.name)}</h3><img src="${i.photo}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#fff"><button class="btn ghost wide" style="margin-top:12px" onclick="closeM()">Fermer</button></div>`;$('#m').classList.add('on')}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();

/* Ventes */
function saleForm(id){
 const av=db.items.filter(i=>i.qty>0);
 if(!av.length)return toast('Aucun article en stock');
 const cur=av.find(i=>i.id===id)||av[0];
 modal('Nouvelle vente',`
 <label>Article<select name="item" onchange="lotP()">${av.map(i=>`<option value="${i.id}" ${i.id===cur.id?'selected':''}>${esc(i.name)} (${i.qty} en stock)</option>`).join('')}</select></label>
 <div class="row"><label>Quantité<input name="qty" type="number" inputmode="numeric" min="1" value="1" required oninput="lotP()"></label><label>Prix unitaire (DA)<input id="up" name="price" type="number" inputmode="decimal" step="any" min="0" required ${role==='staff'&&!can('price')?'readonly':''} value="${sp(cur)}"></label></div>
 <label class="pm pm-tar">Tarif<select name="tar" onchange="lotP()"><option value="n">Normal</option><option value="e">Prix élève</option><option value="r">Prix revendeur</option></select></label>
 <label class="adm">Date de vente<input name="date" type="date" value="${today()}"></label>
 <div class="row pm pm-disc"><label>Remise (DA)<input name="disc" type="number" inputmode="decimal" step="any" min="0" value="0"></label><label>Montant payé (vide = tout)<input name="paid" type="number" inputmode="decimal" step="any" min="0"></label></div>
 <label>Client (obligatoire à crédit)<input name="client" list="cl"></label><datalist id="cl">${[...new Set(db.sales.map(s=>s.client).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`,
 f=>{const it=db.items.find(i=>i.id===f.get('item')),n=+f.get('qty');
  if(n>it.qty)return toast('Stock insuffisant : '+it.qty+' restant(s)');
  const disc=+f.get('disc')||0,tt=n*(+f.get('price'))-disc,pd=f.get('paid')===''?tt:Math.min(+f.get('paid'),tt);
  const s={id:uid(),itemId:it.id,name:it.name,qty:n,price:+f.get('price'),disc,paid:pd,buy:it.buy,date:f.get('date'),by:who,client:f.get('client').trim()};
  if(pd<tt&&!s.client)return toast('Indiquez le client pour une vente à crédit');
  it.qty-=n;db.sales.push(s);lg('Vente : '+it.name+' ×'+n+' = '+fm(tt));if(db.sync&&db.sync.mode==='seller')db.pend.push(s.id);if(pd>0)db.cash.push({id:uid(),date:s.date,type:'in',box:'day',amount:pd,label:'Vente : '+it.name+' ×'+n,ref:s.id});
  save();closeM();render();if(role==='staff'&&can('rec'))receipt(s.id)},'Vendre');

function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();

function payForm(id){const s=db.sales.find(x=>x.id===id);
 modal('Encaisser : '+esc(s.client||s.name),`<p>Reste dû : <b>${fm(due(s))}</b></p><label>Montant reçu (DA)<input name="a" type="number" inputmode="decimal" step="any" min="1" max="${due(s)}" required value="${due(s)}"></label><label>Date<input name="d" type="date" value="${today()}"></label>`,

function closeDay(){const th=bal('day');

  if(c!==th)db.cash.push({id:uid(),date:d,type:c>th?'in':'out',box:'day',amount:Math.abs(c-th),label:'Écart de caisse (compté − théorique)',ref:'gap',pair:p});
  if(v>0)db.cash.push({id:uid(),date:d,type:'out',box:'day',amount:v,label:'Versement vers la caisse principale',ref:'xfer',pair:p},{id:uid(),date:d,type:'in',box:'main',amount:v,label:'Versement de la caisse du jour',ref:'xfer',pair:p});
  db.closes.push({id:p,date:d,th,c,fd,v});lg('Clôture : compté '+fm(c)+', versé '+fm(v));save();closeM();render();toast('Clôture enregistrée')},'Valider la clôture')}
function csv(k){const r=k==='s'?[['Date','Article','Qté','Prix unitaire','Remise','Total','Payé','Reste','Client'],...db.sales.map(s=>[s.date,s.name,s.qty,s.price,s.disc||0,tot(s),paid(s),due(s),s.client||''])]:[['Article','Catégorie','Code','Qté','Prix achat','Prix vente','Dernier achat'],...db.items.map(i=>[i.name,i.cat,i.code||'',i.qty,i.buy,i.sell,i.date])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}));a.download=(k==='s'?'ventes-':'stock-')+today()+'.csv';a.click()}
/* ===== Interface de vente (grille + clavier), panier, attente, modes de paiement ===== */
let pc=[],pk_='',ptar='n';
const pu=(it,n)=>{const b=pfx(it,ptar);return(it.lq>0&&it.lp>0&&n>=it.lq&&b===sp(it))?(Math.floor(n/it.lq)*it.lp+(n%it.lq)*b)/n:b};
const MODES=['Espèces','CCP','Baridimob','Autre'],pcTot=()=>sum(pc,l=>{const it=db.items.find(i=>i.id===l.id);return it?l.qty*pu(it,l.qty):0});
function pk(k){pk_=k==='C'?'':k==='<'?pk_.slice(0,-1):(pk_+k).replace(/^0+/,'').slice(0,3);const e=$('#pkd');if(e)e.textContent=pk_||'1'}
function posAdd(id){const it=db.items.find(i=>i.id===id);if(!it)return;const n=+pk_||1,l=pc.find(x=>x.id===id);if((l?l.qty:0)+n>it.qty)return toast('Stock insuffisant : '+it.qty+' restant(s)');l?l.qty+=n:pc.push({id,qty:n});pk_='';$('#pkd').textContent='1';$('#pcart').innerHTML=cartHtml()}
function posDel(k){pc.splice(k,1);$('#pcart').innerHTML=cartHtml()}
function tiles(){const l=db.items.filter(i=>(i.name+' '+i.cat+' '+(i.code||'')).toLowerCase().includes(q.toLowerCase()));return l.length?l.map(i=>`<button class="tile" onclick="posAdd('${i.id}')" ${i.qty?'':'disabled'}><div class="pi">${i.photo?`<img src="${i.photo}" alt="">`:'📦'}</div><b>${esc(i.name)}</b><span>${fm(pfx(i,ptar))}</span></button>`).join(''):'<p class="empty" style="grid-column:1/3">Aucun article.</p>'}
function cartHtml(){return `<h3>Panier</h3>`+(pc.length?pc.map((l,k)=>{const it=db.items.find(i=>i.id===l.id)||{name:'?'};return `<div class="r2"><div>${esc(it.name)} ×${l.qty}</div><b>${fm(l.qty*pu(it,l.qty))}</b><button class="x" onclick="posDel(${k})" aria-label="Retirer">✕</button></div>`}).join(''):'<p class="mu">Panier vide</p>')+`<div class="g"><div class="t big"><span class="mu">Total</span><b>${fm(pcTot())}</b></div></div><div class="row"><button class="btn ghost" onclick="posHold()">⏸ Mettre en attente</button>${db.holds.length?`<button class="btn ghost" onclick="holdsView()">Reprendre (${db.holds.length})</button>`:''}</div><button class="btn wide" onclick="posPay()">Encaisser</button>`}
function vPos(){return `<div class="row pm pm-tar" style="margin-bottom:8px">${[['n','Normal'],['e','Élève'],['r','Revendeur']].map(t=>`<button class="btn sm ${ptar===t[0]?'':'ghost'}" onclick="ptar='${t[0]}';render()">${t[1]}</button>`).join('')}</div><div class="row" style="margin-bottom:8px"><input class="srch" style="margin:0" type="search" placeholder="Rechercher un article" value="${esc(q)}" oninput="q=this.value;$('#pg').innerHTML=tiles()"><button class="btn ghost" style="flex:none" onclick="scan(c=>{const it=db.items.find(i=>i.code===c);it?posAdd(it.id):toast('Article inconnu')})">📷</button></div><div class="posw"><div id="pg" class="pg">${tiles()}</div><div class="kp"><div class="kd">Qté <b id="pkd">${pk_||'1'}</b></div>${['7','8','9','4','5','6','1','2','3','C','0','<'].map(k=>`<button onclick="pk('${k}')">${k==='<'?'⌫':k}</button>`).join('')}</div></div><div id="pcart">${cartHtml()}</div>`}
function posHold(){if(!pc.length)return toast('Panier vide');db.holds.push({id:uid(),t:Date.now(),lines:pc});pc=[];save();render();toast('Vente mise en attente')}
function holdsView(){$('#m').innerHTML=`<div class="sheet"><h3>Ventes en attente</h3>${db.holds.map(h=>`<div class="r2"><div>${new Date(h.t).toLocaleTimeString('fr-FR',{timeStyle:'short'})}<small>${h.lines.map(l=>{const i=db.items.find(x=>x.id===l.id);return i?esc(i.name)+' ×'+l.qty:''}).join(', ')}</small></div><button class="btn sm" onclick="holdTake('${h.id}')">Reprendre</button><button class="x" onclick="db.holds=db.holds.filter(x=>x.id!=='${h.id}');save();holdsView()" aria-label="Supprimer">✕</button></div>`).join('')||'<p class="empty">Aucune.</p>'}<button class="btn ghost wide" onclick="closeM();render()">Fermer</button></div>`;$('#m').classList.add('on')}
function holdTake(id){const h=db.holds.find(x=>x.id===id);if(!h)return;if(pc.length)db.holds.push({id:uid(),t:Date.now(),lines:pc});db.holds=db.holds.filter(x=>x!==h);pc=h.lines;save();closeM();render()}
function posPay(){if(!pc.length)return toast('Panier vide');const T=pcTot();
 modal('Encaisser '+fm(T),`<label>Mode de paiement<select name="mode">${MODES.map(m=>`<option>${m}</option>`).join('')}</select></label><div class="row pm pm-disc"><label>Remise (DA)<input name="disc" type="number" inputmode="decimal" step="any" min="0" value="0"></label><label>Montant payé (vide = tout)<input name="paid" type="number" inputmode="decimal" step="any" min="0"></label></div><label>Client (obligatoire à crédit)<input name="client" list="cl"></label><datalist id="cl">${[...new Set(db.sales.map(s=>s.client).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`,
 f=>{const disc=Math.min(+f.get('disc')||0,T),net=T-disc,pd=f.get('paid')===''?net:Math.min(+f.get('paid'),net),client=f.get('client').trim(),mode=f.get('mode'),d=today();
  if(pd<net&&!client)return toast('Indiquez le client pour une vente à crédit');
  for(const l of pc){const it=db.items.find(i=>i.id===l.id);if(!it||l.qty>it.qty)return toast('Stock insuffisant')}
  let dl=disc,pl=pd,txt=[];
  pc.forEach((l,k)=>{const it=db.items.find(i=>i.id===l.id),lt=l.qty*pu(it,l.qty),last=k===pc.length-1,ds=last?dl:R2(T?disc*lt/T:0),ps=last?pl:R2(net?pd*(lt-ds)/net:0);dl-=ds;pl-=ps;
   const s={id:uid(),itemId:it.id,name:it.name,qty:l.qty,price:pu(it,l.qty),disc:ds,paid:ps,buy:it.buy,date:d,by:who,client,mode};
   it.qty-=l.qty;db.sales.push(s);if(db.sync&&db.sync.mode==='seller')db.pend.push(s.id);if(ps>0)db.cash.push({id:uid(),date:d,type:'in',box:'day',amount:ps,label:'Vente : '+it.name+' ×'+l.qty,ref:s.id});txt.push(it.name+' ×'+l.qty+' = '+fm(lt))});
  lg('Vente ('+mode+') : '+pc.length+' article(s) = '+fm(net));
  const R='Reçu – Armoire de l’école\n'+dt(d)+(client?'\nClient : '+client:'')+'\n'+txt.join('\n')+(disc?'\nRemise : '+fm(disc):'')+'\nTotal : '+fm(net)+'\nPayé : '+fm(pd)+(pd<net?'\nReste dû : '+fm(net-pd):'')+'\nPaiement : '+mode;
  pc=[];ptar='n';save();closeM();render();if(role!=='staff'||can('rec'))showTxt('Reçu',R,'<button class="btn" onclick="printTxt()">🖨</button>')},'Valider la vente')}

function extraStats(){const m0=today().slice(0,7)+'-01',ms=db.sales.filter(s=>s.date>=m0),md={},cm={},sv={};

const AK=Object.keys(AR).sort((a,b)=>b.length-a.length);
let lang=(()=>{try{return localStorage.getItem('armoire_lang')}catch(e){}})()||'fr';
function setLang(){try{localStorage.setItem('armoire_lang',lang==='ar'?'fr':'ar')}catch(e){}location.reload()}
const ob=new MutationObserver(()=>{ob.disconnect();trAll();ob.observe(document.body,{childList:true,subtree:true,characterData:true})});
function trAll(){if(lang!=='ar')return;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){if(/SCRIPT|STYLE/.test(n.parentNode.tagName))continue;let v=n.nodeValue,o=v;for(const k of AK)if(v.includes(k))v=v.split(k).join(AR[k]);if(v!==o)n.nodeValue=v}
 document.querySelectorAll('[placeholder]').forEach(e=>{const t=AR[e.getAttribute('placeholder')];if(t)e.placeholder=t})}
const sp=i=>(i.pp>0&&(!i.pf||i.pf<=today())&&(!i.pt||today()<=i.pt))?i.pp:i.sell;
async function fb(p,m='GET',b){const y=db.sync,r=await fetch(y.url.replace(/\/+$/,'')+'/armoire/'+y.room+'/'+p+'.json',{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);return r.json()}
async function pushCat(){const c=db.items.map(i=>({id:i.id,name:i.name,cat:i.cat||'',code:i.code||'',sell:sp(i),qty:i.qty,min:i.min,lq:i.lq||0,lp:i.lp||0,pe:i.pe||0,pr:i.pr||0,photo:i.photo||''})),j=JSON.stringify(c);if(j===lastCat)return;await fb('catalog','PUT',c);await fb('ver','PUT',Date.now());lastCat=j}
async function syncTick(){const y=db.sync;if(!y||!y.url||!y.room||busy||!navigator.onLine)return;busy=1;let ch=0;
 try{if(y.mode==='seller'){
   for(const id of db.pend){const s=db.sales.find(x=>x.id===id);if(s&&!s.sent){await fb('inbox/'+id,'PUT',s);s.sent=1;ch=1}}
   const ak=await fb('ack')||{};
   db.pend=db.pend.filter(id=>{if(ak[id]){fb('ack/'+id,'DELETE').catch(()=>{});ch=1;return false}return true});
   const v=await fb('ver');
   if(v&&v!==db.cver){db.items=Object.values(await fb('catalog')||{});db.pend.forEach(id=>{const s=db.sales.find(x=>x.id===id),it=s&&db.items.find(i=>i.id===s.itemId);if(it)it.qty=Math.max(0,it.qty-s.qty)});db.cver=v;ch=1}
  }else{
   const ib=await fb('inbox')||{},ids=Object.keys(ib);
   for(const id of ids){const s=ib[id];if(db.sales.some(x=>x.id===id))continue;const it=db.items.find(i=>i.id===s.itemId);if(it){it.qty=Math.max(0,it.qty-s.qty);s.buy=it.buy}delete s.sent;db.sales.push(s);if(s.paid>0)db.cash.push({id:uid(),date:s.date,type:'in',box:'day',amount:s.paid,label:'Vente : '+s.name+' ×'+s.qty,ref:id});lg('Vente reçue ('+(s.by||'vendeur')+') : '+s.name+' ×'+s.qty);ch=1}
   await pushCat();
   for(const id of ids){await fb('ack/'+id,'PUT',true);await fb('inbox/'+id,'DELETE')}
  }
  y.st='OK '+new Date().toLocaleTimeString('fr-FR')}catch(e){y.st='Erreur : '+e.message}
 busy=0;if(ch){save(1);render()}}
function syncForm(){const y=db.sync||{};
 modal('Synchronisation',`<small>Serveur gratuit Firebase : suivez les étapes données dans la discussion.</small><label>Adresse de la base (URL)<input name="u" placeholder="https://xxx-default-rtdb.firebaseio.com" value="${esc(y.url||'')}"></label><label>Code secret de l’armoire (long)<input name="r" value="${esc(y.room||'')}"></label><button type="button" class="btn sm ghost" style="margin-top:6px" onclick="$('#f').r.value=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(36).padStart(2,'0')).join('')">Générer un code secret</button><label>Ce téléphone est<select name="m"><option value="admin" ${y.mode!=='seller'?'selected':''}>Maître (admin)</option><option value="seller" ${y.mode==='seller'?'selected':''}>Téléphone vendeur</option></select></label>`,
 f=>{db.sync={url:f.get('u').trim(),room:f.get('r').trim(),mode:f.get('m'),st:''};lastCat='';save(1);closeM();syncTick();render();toast('Synchronisation activée')})}

 return l.length?l.map(i=>{const low=i.qty<=i.min;return `<div class="r2"><div>${esc(i.name)}<small>En stock : ${i.qty} – ${fm(i.buy)}</small></div><input name="q_${i.id}" type="number" inputmode="numeric" min="0" style="width:84px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px" value="${low?Math.max(1,(i.min||2)*2-i.qty):''}"></div>`}).join(''):'<p class="empty">Aucun article.</p>';
}

 modal('Bon de commande',`<label>Fournisseur<select name="sup" onchange="$('#ol').innerHTML=ordList(this.value)"><option value="">Tous les articles</option>${sups.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><div id="ol" style="margin-top:10px">${ordList('')}</div><label>Date<input name="d" type="date" value="${today()}"></label><label>Remarques<input name="nt"></label>`,

function parseCsv(t,d){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=0}else c+=ch}else if(ch==='"')q=1;else if(ch===d){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}

  let a=0,u=0;
  R.forEach(r=>{const g=i=>i>=0?String(r[i]??'').trim():'',name=g(M.n);if(!name)return;const code=g(M.k);
   let it=db.items.find(i=>(code&&i.code===code)||i.name.toLowerCase()===name.toLowerCase());

   st('cat',M.c,g(M.c));st('code',M.k,code);st('sup',M.s,g(M.s));st('buy',M.b,num(g(M.b)));st('sell',M.v,num(g(M.v)));st('qty',M.q,Math.floor(num(g(M.q))));st('min',M.m,Math.floor(num(g(M.m))))});

function bars(c,txt,x,y,w,h){const v=[...txt].map(ch=>{const k=ch.charCodeAt(0)-32;return k>=0&&k<95?k:13});let cs=104;v.forEach((k,i)=>cs+=k*(i+1));

  c.fillStyle='#111';c.textBaseline='alphabetic';c.textAlign='center';c.direction=lang==='ar'?'rtl':'ltr';c.font='bold 24px '+FN;let nm=i.name;while(nm.length>1&&c.measureText(nm).width>cw-40)nm=nm.slice(0,-1);
  c.fillText(nm,x+cw/2,y+40);c.font='bold 40px '+FN;c.fillText(F(sp(i)),x+cw/2,y+90);bars(c,i.code||i.id.toUpperCase(),x+20,y+104,cw-40,50);c.font='18px '+FN;c.fillText(i.code||i.id.toUpperCase(),x+cw/2,y+180)});

function expForm(){modal('Nouveau frais',`<label>Nature (loyer, électricité, salaire…)<input name="l" required></label><label>Montant (DA)<input name="a" type="number" min="0" step="any" required></label><label>Date<input name="d" type="date" value="${today()}"></label>`,f=>{db.exp.push({id:uid(),label:f.get('l').trim(),amount:+f.get('a')||0,date:f.get('d')||today()});lg('Frais : '+f.get('l'));save();expView()})}
function expDel(id){db.exp=db.exp.filter(e=>e.id!==id);save();expView()}
function famView(){const n=[...new Set(db.sales.map(s=>(s.client||'').trim()).filter(Boolean))].sort();pSh('👨‍👩‍👧 Fiche famille',`<input class="srch" id="fq" placeholder="Rechercher un nom…" oninput="famList()"><div id="fl"></div>`);famList()}
function famList(){const q=($('#fq')?.value||'').toLowerCase(),m={};db.sales.forEach(s=>{const c=(s.client||'').trim();if(!c||!c.toLowerCase().includes(q))return;const e=m[c]??={t:0,d:0,n:0,l:[]};e.t+=tot(s);e.d+=due(s);e.n++;e.l.push(s)});
$('#fl').innerHTML=Object.entries(m).sort((a,b)=>b[1].d-a[1].d).slice(0,30).map(([c,e])=>`<div class="r2"><div><b>${esc(c)}</b><small>${e.n} achat(s) · total ${fm(e.t)}</small><small>${e.l.slice(-3).map(s=>esc(s.name)+' ×'+s.qty).join(', ')}</small></div><b style="color:var(${e.d>0?'--bad':'--ok'})">${e.d>0?'Doit '+fm(e.d):'Soldé'}</b></div>`).join('')||'<small>Aucun client trouvé.</small>'}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon App Synchro Firebase</title>
</head>
<body>

    <h1>Ma Super Application</h1>
    <input type="text" id="maDonnee" placeholder="Entrez un texte à synchroniser...">
    <button onclick="sauvegarderDonnee()">Enregistrer</button>

    <p><strong>Donnée stockée dans le Cloud :</strong> <span id="affichage">Chargement...</span></p>

    <!-- 1. Importer les scripts SDK Firebase (version modulaire compatible web) -->
    <script type="module">
        // Importez les fonctions nécessaires depuis le CDN Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. Collez ici VOTRE configuration Firebase récupérée à l'étape 2
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "votre-projet.firebaseapp.com",
            projectId: "votre-projet",
            storageBucket: "votre-projet.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 3. Fonction pour sauvegarder une donnée dans Firestore
        window.sauvegarderDonnee = async function() {
            const texte = document.getElementById('maDonnee').value;
            try {
                // On enregistre le texte dans un document nommé "config" ou "donnees"
                await setDoc(doc(db, "appData", "maCleUnique"), {
                    valeur: texte,
                    derniereMiseAJour: new Date()
                });
                alert("Donnée synchronisée avec succès !");
            } catch (e) {
                console.error("Erreur lors de l'enregistrement : ", e);
            }
        };

        // 4. Écouter les changements en temps réel (Synchronisation instantanée entre téléphones !)
        onSnapshot(doc(db, "appData", "maCleUnique"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('affichage').innerText = data.valeur;
            } else {
                document.getElementById('affichage').innerText = "Aucune donnée trouvée.";
            }
        });
    </script>
</body>
</html>
